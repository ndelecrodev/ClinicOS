name: pr-labeler

# Aplica o label da PR a partir do prefixo da branch (ver .github/labeler.yml).
# Roda em pull_request, então vale para PRs com base na develop, não só na main.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  label:
    name: label pela branch
    # PRs do Dependabot recebem token somente leitura; o prefixo dependabot/ cobre o label depois do merge.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aplica o label
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
