name: pr-title

# O título da PR vira a mensagem do squash na develop (e a linha das notas de release),
# então precisa seguir Conventional Commits em português: tipo(escopo opcional): descrição em minúsculas.
# Só lê o título, sem acesso de escrita.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  titulo:
    name: título no padrão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Valida o título da PR
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            A descrição "{subject}" deve começar com letra minúscula.
            Exemplo: "feat(scheduling): adiciona cálculo de slots livres".
